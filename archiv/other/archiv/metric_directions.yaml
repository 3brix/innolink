# metric_directions.yaml
# ===============================
# Advanced normalization for ROC-AUC, PR-AUC, and Classification.
#
# Transform Types:
#   identity:       Already 0-1 (e.g., ipTM, ipsae).
#   linear_100:     Divide by 100 (e.g., pLDDT).
#   inv_linear:     1 - (x / max_bound) -> Maps 0 error to 1.0 (best).
#   clipped_minmax: Map [min, max] to [0, 1] after clipping (best for energies).

metrics:

  # ── AF3 (AlphaFold 3) ─────────────────────────────────────────────────────
  af3_pae:                         {direction: -1, type: "error",      transform: "inv_linear", bounds: [0, 31.75]}
  af3_plddt:                       {direction: 1,  type: "quality",    transform: "linear_100", bounds: [0, 100]}
  af3_interface_dG:                {direction: -1, type: "energy",     transform: "clipped_minmax", bounds: [-100, 0]}
  af3_interface_dG_SASA_ratio:     {direction: -1, type: "density",    transform: "clipped_minmax", bounds: [-0.06, 0]}
  af3_ipae:                        {direction: -1, type: "error",      transform: "inv_linear", bounds: [0, 31.75]}
  af3_iplddt:                      {direction: 1,  type: "quality",    transform: "linear_100", bounds: [0, 100]}
  af3_ipsae:                       {direction: 1,  type: "confidence", transform: "identity",   bounds: [0, 1]}
  af3_iptm:                        {direction: 1,  type: "confidence", transform: "identity",   bounds: [0, 1]}
  af3_ptm:                         {direction: 1,  type: "confidence", transform: "identity",   bounds: [0, 1]}
  af3_pyros_binder_score:          {direction: -1, type: "energy",     transform: "clipped_minmax", bounds: [-60, 0]}
  af3_rank:                        {direction: -1, type: "rank",       transform: "clipped_minmax", bounds: [1, 5]}
  af3_ranking_score:               {direction: -1, type: "confidence", transform: "clipped_minmax", bounds: [-5, 0]}
  af3_rank0_masif:                 {direction: 1,  type: "shape",      transform: "identity",   bounds: [0, 1]}

  # ── ColabFold (cf) ────────────────────────────────────────────────────────
  cf_af3_rmsd:                     {direction: -1, type: "consensus",  transform: "inv_linear", bounds: [0, 15]}
  cf_pae:                          {direction: -1, type: "error",      transform: "inv_linear", bounds: [0, 31.75]}
  cf_plddt:                        {direction: 1,  type: "quality",    transform: "linear_100", bounds: [0, 100]}
  cf_interface_dG:                 {direction: -1, type: "energy",     transform: "clipped_minmax", bounds: [-100, 0]}
  cf_interface_dG_SASA_ratio:      {direction: -1, type: "density",    transform: "clipped_minmax", bounds: [-0.06, 0]}
  cf_ipae:                         {direction: -1, type: "error",      transform: "inv_linear", bounds: [0, 31.75]}
  cf_iplddt:                       {direction: 1,  type: "quality",    transform: "linear_100", bounds: [0, 100]}
  cf_ipsae:                        {direction: 1,  type: "confidence", transform: "identity",   bounds: [0, 1]}
  cf_iptm:                         {direction: 1,  type: "confidence", transform: "identity",   bounds: [0, 1]}
  cf_ptm:                          {direction: 1,  type: "confidence", transform: "identity",   bounds: [0, 1]}
  cf_pyros_binder_score:           {direction: -1, type: "energy",     transform: "clipped_minmax", bounds: [-60, 0]}
  cf_rank:                         {direction: -1, type: "rank",       transform: "clipped_minmax", bounds: [1, 5]}
  cf_rank0_masif:                  {direction: 1,  type: "shape",      transform: "identity",   bounds: [0, 1]}

  # ── ESMFold & Pred ────────────────────────────────────────────────────────
  esmfold_ipae:                    {direction: -1, type: "error",      transform: "inv_linear", bounds: [0, 31.75]}
  esmfold_iplddt:                  {direction: 1,  type: "quality",    transform: "linear_100", bounds: [0, 100]}
  esmfold_plddt:                   {direction: 1,  type: "quality",    transform: "linear_100", bounds: [0, 100]}
  esmfold_pae:                     {direction: -1, type: "error",      transform: "inv_linear", bounds: [0, 31.75]}
  esmfold_ptm:                     {direction: 1,  type: "confidence", transform: "identity",   bounds: [0, 1]}
  pred_ilddt:                      {direction: 1,  type: "quality",    transform: "linear_100", bounds: [0, 100]}
  pred_lddt:                       {direction: 1,  type: "quality",    transform: "linear_100", bounds: [0, 100]}

  # ── Chai-1 (Unconstrained & Constrained) ──────────────────────────────────
  chai_unconstrained_score:           {direction: 1, type: "confidence", transform: "identity", bounds: [0, 1]}
  chai_unconstrained_aggregate_score: {direction: 1, type: "confidence", transform: "identity", bounds: [0, 1]}
  chai_unconstrained_ptm:             {direction: 1, type: "confidence", transform: "identity", bounds: [0, 1]}
  chai_unconstrained_iptm:            {direction: 1, type: "confidence", transform: "identity", bounds: [0, 1]}
  chai_unconstrained_interface_iptm:  {direction: 1, type: "confidence", transform: "identity", bounds: [0, 1]}

  chai_constrained_score:             {direction: 1, type: "confidence", transform: "identity", bounds: [0, 1]}
  chai_constrained_aggregate_score:   {direction: 1, type: "confidence", transform: "identity", bounds: [0, 1]}
  chai_constrained_ptm:               {direction: 1, type: "confidence", transform: "identity", bounds: [0, 1]}
  chai_constrained_iptm:              {direction: 1, type: "confidence", transform: "identity", bounds: [0, 1]}
  chai_constrained_interface_iptm:    {direction: 1, type: "confidence", transform: "identity", bounds: [0, 1]}

  # ── Boltz-1 (Free & Template) ─────────────────────────────────────────────
  boltz_free_confidence_score:     {direction: 1,  type: "confidence", transform: "identity",   bounds: [0, 1]}
  boltz_free_ptm:                  {direction: 1,  type: "confidence", transform: "identity",   bounds: [0, 1]}
  boltz_free_iptm:                 {direction: 1,  type: "confidence", transform: "identity",   bounds: [0, 1]}
  boltz_free_plddt:                {direction: 1,  type: "quality",    transform: "linear_100", bounds: [0, 100]}
  boltz_free_iplddt:               {direction: 1,  type: "quality",    transform: "linear_100", bounds: [0, 100]}
  boltz_free_pde:                  {direction: -1, type: "error",      transform: "inv_linear", bounds: [0, 32]}
  boltz_free_ipde:                 {direction: -1, type: "error",      transform: "inv_linear", bounds: [0, 32]}
  boltz_free_per_chain_pair_iptm:  {direction: 1,  type: "confidence", transform: "identity",   bounds: [0, 1]}

  boltz_template_confidence_score: {direction: 1,  type: "confidence", transform: "identity",   bounds: [0, 1]}
  boltz_template_ptm:              {direction: 1,  type: "confidence", transform: "identity",   bounds: [0, 1]}
  boltz_template_iptm:             {direction: 1,  type: "confidence", transform: "identity",   bounds: [0, 1]}
  boltz_template_plddt:            {direction: 1,  type: "quality",    transform: "linear_100", bounds: [0, 100]}
  boltz_template_iplddt:           {direction: 1,  type: "quality",    transform: "linear_100", bounds: [0, 100]}
  boltz_template_pde:              {direction: -1, type: "error",      transform: "inv_linear", bounds: [0, 32]}
  boltz_template_ipde:             {direction: -1, type: "error",      transform: "inv_linear", bounds: [0, 32]}
  boltz_template_per_chain_pair_iptm: {direction: 1, type: "confidence", transform: "identity", bounds: [0, 1]}