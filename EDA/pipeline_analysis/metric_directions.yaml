# metric_directions.yaml
# ======================
# Directionality for ROC-AUC evaluation.
#
# direction: +1  ->  higher = better binder  (iptm, plddt, confidence...)
# direction: -1  ->  lower  = better binder  (dG, pae, rmsd, pde...)
#
# NOTE: Only base metric names are listed here.
# The script automatically applies the same direction to all column families
# sharing the same base metric (raw, notpl_raw, custom_raw variants).
# Example: interface_pae: -1 covers af3_interface_pae, af3_raw_interface_pae,
#          af3_notpl_raw_interface_pae, cf_interface_pae, cf_raw_interface_pae, etc.
#
# NOTE: For ML (future), transforms and bounds will be needed.
# At that point consider migrating to a richer config or QuantileTransformer
# fit on training data only — do NOT use static bounds as a substitute.
#
# TIP: After a first run, check roc_auc in the output CSV.
# roc_auc < 0.5 means the direction is wrong — flip it here and rerun.

metrics:

  af3_pae:                {direction: -1}
  af3_plddt:              {direction: +1}
  af3_interface_dG:       {direction: -1}
  af3_interface_dG_SASA_ratio: {direction: -1}
  af3_ipae:               {direction: -1}
  af3_iplddt:             {direction: +1}
  af3_ipsae:              {direction: +1}
  af3_iptm:               {direction: +1}
  af3_ptm:                {direction: +1}
  af3_pyros_binder_score: {direction: -1}
  af3_ranking_score:      {direction: +1}
  af3_rank0_masif:        {direction: +1}

  cf_af3_rmsd:            {direction: -1}
  cf_pae:                 {direction: -1}
  cf_plddt:               {direction: +1}
  cf_ipae:                {direction: -1}
  cf_iplddt:              {direction: +1}
  cf_ipsae:               {direction: +1}
  cf_iptm:                {direction: +1}
  cf_ptm:                 {direction: +1}
  cf_rank0_masif:         {direction: +1}
  pred_ilddt:             {direction: +1}
  pred_lddt:              {direction: +1}

  esmfold_ipae:           {direction: -1}
  esmfold_iplddt:         {direction: +1}
  esmfold_plddt:          {direction: +1}
  esmfold_pae:            {direction: -1}
  esmfold_ptm:            {direction: +1}

  chai_unconstrained_score:        {direction: +1}
  chai_constrained_score:          {direction: +1}
  chai_unconstrained_aggregate_score: {direction: +1}
  chai_unconstrained_ptm:          {direction: +1}
  chai_unconstrained_iptm:         {direction: +1}
  chai_unconstrained_per_chain_ptm_mean: {direction: +1}
  chai_unconstrained_per_chain_ab_iptm_mean: {direction: +1}
  chai_unconstrained_interface_iptm: {direction: +1}
  chai_constrained_aggregate_score: {direction: +1}
  chai_constrained_ptm:            {direction: +1}
  chai_constrained_iptm:           {direction: +1}
  chai_constrained_per_chain_ptm_mean:  {direction: +1}
  chai_constrained_per_chain_ab_iptm_mean: {direction: +1}
  chai_constrained_interface_iptm: {direction: +1}
  
  boltz_free_confidence_score:     {direction: +1}
  boltz_free_ptm:                  {direction: +1}
  boltz_free_iptm:                 {direction: +1}
  boltz_free_plddt:                {direction: +1}
  boltz_free_iplddt:               {direction: +1}
  boltz_free_pde:                  {direction: -1}
  boltz_free_ipde:                 {direction: -1}
  boltz_free_per_chain_pair_iptm:  {direction: +1}
  boltz_template_confidence_score: {direction: +1}
  boltz_template_ptm:              {direction: +1}
  boltz_template_iptm:             {direction: +1}
  boltz_template_plddt:            {direction: +1}
  boltz_template_iplddt:           {direction: +1}
  boltz_template_pde:              {direction: -1}
  boltz_template_ipde:             {direction: -1}
  boltz_template_per_chain_pair_iptm: {direction: +1}

