  per_chain_ab_iptm_mean: 0.7   # dir [1], interface, confidence, 2 members
  per_chain_pair_iptm: 0.7  # dir [1], interface, confidence, 4 members
  per_chain_ptm: 0.7   # dir [1], confidence, confidence, 2 members
  per_chain_ptm_mean: 0.7   # dir [1], confidence, confidence, 2 members
  plddt: 0.7   # dir [1], confidence, confidence, 7 members
  ptm: 0.7   # dir [1], confidence, confidence, 8 members
  pyros_binder_score: 0   # dir [-1], energy, energy, 2 members
  rank: 0.9   # dir [-1], ranking, rank, 2 members
  rank0_masif: 0.9   # dir [1], interface, confidence, 2 members
  ranking_score: 0.9   # dir [1], confidence, confidence, 1 members
  rmsd: 2.5   # dir [-1], geometry, distance, 1 members
  sap: 0.4  # dir [-1], developability, developability, 6 members
